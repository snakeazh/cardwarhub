syntax = "proto3";

package cardwar;

import "model.proto";

option go_package = "ruoyi-go/proto/gen/cardwar";

// ============================================================
// 无尽塔下一层
// ============================================================

message NextFloorRequest {
  int32 tower_id = 1;
  int32 node_id = 2;
}

message NextFloorResponse {
  PlayerEndlessTower tower = 1;
}

// ============================================================
// 领取爬塔宝箱奖励
// ============================================================

message ReceiveTowerChestRewardRequest {
  int32 tower_id = 1;
  int32 node_id = 2;
}

message ReceiveTowerChestRewardResponse {
  PlayerEndlessTower tower = 1;
  ResultItems items = 2;
  map<int32, int64> rewards = 3;
}

// ============================================================
// 领取每日奖励
// ============================================================

message ReceiveDailyRewardRequest {
  int32 tower_id = 1;
}

message ReceiveDailyRewardResponse {
  PlayerEndlessTower tower = 1;
  ResultItems items = 2;
  map<int32, int64> rewards = 3;
}
