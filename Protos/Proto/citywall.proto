syntax = "proto3";

package cardwar;

import "model.proto";

option go_package = "ruoyi-go/proto/gen/cardwar";

// ============================================================
// 城墙升级
// /api/cityWall/upgrade
// ============================================================

message CityWallUpgradeRequest {
}

message CityWallUpgradeResponse {
  PlayerCityWall city_wall = 1;
  ResultItems items = 2;
}

// ============================================================
// 城墙技能激活
// /api/cityWall/skill/activate
// ============================================================

message CityWallSkillActivateRequest {
  int32 skill_id = 1;
}

message CityWallSkillActivateResponse {
  PlayerCityWallSkill skill = 1;
  ResultItems items = 2;
}

// ============================================================
// 城墙技能升级
// /api/cityWall/skill/upgrade
// ============================================================

message CityWallSkillUpgradeRequest {
  int32 skill_id = 1;
}

message CityWallSkillUpgradeResponse {
  PlayerCityWallSkill skill = 1;
  ResultItems items = 2;
}

// ============================================================
// 保存城墙槽位
// /api/cityWall/save
// ============================================================

message CityWallSaveRequest {
  repeated int32 slot_skills = 1;
}

message CityWallSaveResponse {
  repeated int32 slot_skills = 1;
  ResultItems items = 2;
}
