syntax = "proto3";

package cardwar;

import "model.proto";

option go_package = "ruoyi-go/proto/gen/cardwar";

// ============================================================
// 签到
// ============================================================

message SigninResponse {
  ResultItems items = 1;
  PlayerSignin signin = 2;
  repeated RewardAndNum rewards = 3;
}

// ============================================================
// 创建活动奖励（月卡/基金/通行证/累充/首充 通用）
// ============================================================

message ActivityRewardsRequest {
  int32 activity_id = 1;
  int32 part_id = 2;
}

message ActivityRewardsResponse {
  ResultItems items = 1;
  map<int32, int64> rewards = 2;
  UserCreatePlayerActivity activity = 3;
}
