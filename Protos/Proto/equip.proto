syntax = "proto3";

package cardwar;

import "model.proto";

option go_package = "ruoyi-go/proto/gen/cardwar";

// ============================================================
// 穿戴装备
// ============================================================

message WearEquipRequest {
  int32 id = 1;
  int32 wearer_id = 2;
}

message WearEquipResponse {
  repeated PlayerEquip equips = 1;
  ResultItems items = 2;
}

// ============================================================
// 升阶装备
// ============================================================

message UpPhaseEquipRequest {
  repeated int32 ids = 1;
}

message UpPhaseEquipResponse {
  repeated PlayerEquip equips = 1;
  ResultItems items = 2;
}

// ============================================================
// 分解装备
// ============================================================

message FragmentEquipRequest {
  repeated int32 ids = 1;
}

message FragmentEquipResponse {
  ResultItems items = 1;
  repeated RewardAndNum rewards = 2;
  repeated int32 fragment_ids = 3;
}

// ============================================================
// 刷新词条
// /api/equip/refreshEntryEquip
// ============================================================

message RefreshEntryEquipRequest {
  int32 id = 1;
  repeated int32 locked_effects = 2;
}

message RefreshEntryEquipResponse {
  PlayerEquip equip = 1;
  ResultItems items = 2;
}

// ============================================================
// 使用刷新词条
// /api/equip/useRefreshEntryEquip
// ============================================================

message UseRefreshEntryEquipRequest {
  int32 id = 1;
}

message UseRefreshEntryEquipResponse {
  PlayerEquip equip = 1;
  ResultItems items = 2;
}
