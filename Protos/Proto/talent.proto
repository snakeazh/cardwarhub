syntax = "proto3";

package cardwar;

import "model.proto";

option go_package = "ruoyi-go/proto/gen/cardwar";

// ============================================================
// 使用天赋
// ============================================================

message UseTalentRequest {
  int32 id = 1;
  int32 status = 2;
}

message UseTalentResponse {
  repeated PlayerTalent talents = 1;
}

// ============================================================
// 升级天赋
// ============================================================

message UpGradeTalentRequest {
  int32 id = 1;
  int32 upgrade_extra = 2;
}

message UpGradeTalentResponse {
  PlayerTalent talent = 1;
  ResultItems items = 2;
}
