syntax = "proto3";

package cardwar;

import "model.proto";

option go_package = "ruoyi-go/proto/gen/cardwar";

// ============================================================
// 开始战斗
// ============================================================

message StartBattleRequest {
  int32 stage_id = 1;
}

message StartBattleResponse {
  PlayerStage stage = 1;
  PlayerBattle battle = 2;
  ResultItems items = 3;
}

// ============================================================
// 战斗结算
// ============================================================

message BattleData {
  int32 scores = 1;
  int64 damage = 2;
  int32 winner = 3;
  int32 clear_day = 4;
  int32 clear_stage_time = 5;
  bool is_soldier_death = 6;
  bool is_soldier_reduce_hp = 7;
  map<int32, int32> monster_atlas = 8;
  bool school_max_card_count = 9;
}

message SettleBattleRequest {
  BattleData battle_data = 1;
}

message SettleBattleResponse {
  map<int32, int64> rewards = 1;
  PlayerStage stage = 2;
  PlayerBattle battle = 3;
  ResultItems items = 4;
  repeated PlayerCard cards = 5;
  repeated PlayerTeam teams = 6;
  PlayerEndlessTower endless_tower = 7;
  PlayerChallengeBoss challenge_boss = 8;
  PlayerHiddenRealmTower hidden_realm_tower = 9;
  PlayerAtlas atlas = 10;
}

// ============================================================
// 退出战斗
// ============================================================

message ExitBattleResponse {
  PlayerBattle battle = 1;
}

// ============================================================
// 领取关卡条件奖励
// ============================================================

message StageReceiveRewardsRequest {
  int32 stage_id = 1;
  int32 condition = 2;
}

message StageReceiveRewardsResponse {
  map<int32, int64> rewards = 1;
  PlayerStage stage = 2;
  PlayerBattle battle = 3;
  ResultItems items = 4;
  repeated PlayerCard cards = 5;
  repeated PlayerTeam teams = 6;
  PlayerEndlessTower endless_tower = 7;
  PlayerChallengeBoss challenge_boss = 8;
  PlayerHiddenRealmTower hidden_realm_tower = 9;
}


// ============================================================
// 关卡扫荡
// ============================================================
message StageSweepingRequest {
  int32 stage_id = 1;
}

message StageSweepingResponse {
  map<int32, int64> rewards = 1;
  PlayerStage stage = 2;
  PlayerBattle battle = 3;
  ResultItems items = 4;
  repeated PlayerCard cards = 5;
  repeated PlayerTeam teams = 6;
  PlayerEndlessTower endless_tower = 7;
  PlayerChallengeBoss challenge_boss = 8;
  PlayerHiddenRealmTower hidden_realm_tower = 9;
}

// ============================================================
// 挂机奖励AFK
// ============================================================
message ChapterAfkRewardsRequest {
  
}


message ChapterAfkRewardsResponse {
  map<int32, int64> rewards = 1;
  PlayerStage stage = 2;
  PlayerBattle battle = 3;
  ResultItems items = 4;
  repeated PlayerCard cards = 5;
  repeated PlayerTeam teams = 6;
  PlayerEndlessTower endless_tower = 7;
  PlayerChallengeBoss challenge_boss = 8;
  PlayerHiddenRealmTower hidden_realm_tower = 9;
}
